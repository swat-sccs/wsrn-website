version: '3.4'

services:
  wsrn:
    init: true
    restart: unless-stopped
    env_file:
      - .env.local
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    command: /bin/sh -c "npx prisma generate && npm run dev"
    volumes:
      - .:/app
      - ./data/images:/usr/src/app/public
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      NODE_ENV: development
    ports:
      - 3000:3000
      - 9229:9229
      - 5555:5555
    networks:
      - internal

  wsrn-website-db:
    image: mariadb:10.7
    ports:
      - 3306:3306
    env_file:
      - .env.local
    volumes:
      - ./mock_sql/initMockDatabase.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/db:/var/lib/mysql
    networks:
      - internal

  static:
    image: edirom/cantaloupe
    restart: unless-stopped
    ports:
      - 8182:8182
    volumes:
      - ./data/images:/opt/cantaloupe/images
    configs:
      - source: cantaloupe_conf
        target: /etc/cantaloupe.properties
    networks:
      - internal

configs:
  cantaloupe_conf:
    file: ./cantaloupe.properties

networks:
  internal:
